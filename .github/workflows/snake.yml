name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Run once a day
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Jgzingg
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#39ff14
            dist/github-contribution-grid-snake.gif?color_snake=#39ff14&color_dots=#0a0c10,#0e4429,#006d32,#26a641,#39ff14

      - name: Push output to snake-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
